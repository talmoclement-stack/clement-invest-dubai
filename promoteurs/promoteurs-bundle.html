document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #ECE7DB; border-radius:10px; padding:13px 14px;\">\n              <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#9AA0A6;\">Transactions<\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:600; color:#16243B; margin-top:5px;\">{{ dev.txStr }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #ECE7DB; border-radius:10px; padding:13px 14px;\">\n              <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#9AA0A6;\">Taille<\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:600; color:#16243B; margin-top:5px;\">{{ dev.tailleStr }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- forces / faiblesses -->\n        <sc-if value=\"{{ dev.hasForces }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;\">\n            <div>\n              <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#1F8A5B; margin-bottom:9px;\">Forces<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                <sc-for list=\"{{ dev.forces }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex; gap:8px; font-size:12.5px; line-height:1.4; color:#3A3F49;\"><span style=\"color:#1F8A5B; font-weight:700;\">✓<\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#B4503C; margin-bottom:9px;\">Points de vigilance<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                <sc-for list=\"{{ dev.faiblesses }}\" as=\"f\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; gap:8px; font-size:12.5px; line-height:1.4; color:#3A3F49;\"><span style=\"color:#B4503C; font-weight:700;\">!<\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- à vérifier -->\n        <div style=\"background:#FBF4E2; border:1px solid #EAD9AE; border-radius:10px; padding:12px 15px; margin-bottom:20px; display:flex; gap:10px; align-items:flex-start;\">\n          <span style=\"font-size:15px;\">🔍<\u002Fspan>\n          <div><span style=\"font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#8A6A1E;\">À vérifier<\u002Fspan><div style=\"font-size:13px; color:#5A4A20; margin-top:2px;\">{{ dev.aVerifier }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- zones -->\n        <sc-if value=\"{{ dev.hasZones }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-bottom:20px;\">\n            <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#16243B; margin-bottom:9px;\">Zones d'intervention<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:7px;\">\n              <sc-for list=\"{{ dev.zones }}\" as=\"z\" hint-placeholder-count=\"3\">\n                <span style=\"background:#fff; border:1px solid #DDE6F2; color:#2D4A7A; padding:5px 11px; border-radius:999px; font-size:12px;\">{{ z }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- projets -->\n        <div>\n          <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#16243B; margin-bottom:9px;\">Projets emblématiques<\u002Fdiv>\n          <sc-if value=\"{{ dev.hasProjets }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:7px;\">\n              <sc-for list=\"{{ dev.projets }}\" as=\"p\" hint-placeholder-count=\"0\">\n                <div style=\"background:#fff; border:1px solid #ECE7DB; border-radius:8px; padding:10px 13px; font-size:13px; color:#3A3F49;\">{{ p }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ dev.noProjets }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1.5px dashed #D6D0C2; border-radius:10px; padding:18px; text-align:center; color:#A8A294; font-size:12.5px; background:repeating-linear-gradient(45deg,#FAF8F2,#FAF8F2 9px,#F3F0E7 9px,#F3F0E7 18px);\">Projets emblématiques — à renseigner<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Bouton de contact flottant (lead magnet) -->\n  <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Être recontacté sur WhatsApp\" style=\"position:fixed; bottom:22px; right:22px; z-index:990; display:flex; align-items:center; gap:9px; padding:12px 18px 12px 15px; border-radius:999px; background:#25D366; color:#fff; text-decoration:none; font-family:'Be Vietnam Pro',sans-serif; font-size:13.5px; font-weight:500; box-shadow:0 8px 26px rgba(37,211,102,.34), 0 2px 8px rgba(0,0,0,.14);\" style-hover=\"transform:translateY(-2px); box-shadow:0 12px 32px rgba(37,211,102,.44), 0 2px 8px rgba(0,0,0,.14);\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z\"><\u002Fpath><\u002Fsvg>\n    Être recontacté\n  <\u002Fa>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tableau&quot;,&quot;carte&quot;],&quot;default&quot;:&quot;tableau&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showSales&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mapStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Clair&quot;,&quot;Détaillé&quot;,&quot;Sombre&quot;],&quot;default&quot;:&quot;Clair&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      view: (props && props.defaultView) || 'tableau',\n      query: '',\n      dev: null,\n      district: null,\n    };\n    this.mapRef = React.createRef();\n    this.map = null;\n    this.markers = {};\n    this._poll = null;\n  }\n\n  componentDidMount() { this._initWhenReady(); }\n  componentWillUnmount() {\n    if (this._poll) clearTimeout(this._poll);\n    if (this.map) { this.map.remove(); this.map = null; }\n  }\n\n  _tileUrl() {\n    const s = (this.props && this.props.mapStyle) || 'Clair';\n    if (s === 'Sombre') return 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';\n    if (s === 'Détaillé') return 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';\n    return 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';\n  }\n\n  _initWhenReady() {\n    // Dès que les données sont prêtes, on redessine le tableau (utile en bundle où\n    // les scripts data se chargent après le premier rendu).\n    if (window.PROMOTEURS && window.QUARTIERS && !this._dataFlushed) {\n      this._dataFlushed = true;\n      this.forceUpdate();\n    }\n    if (!window.L || !window.QUARTIERS || !window.PROMOTEURS || !this.mapRef.current) {\n      this._poll = setTimeout(() => this._initWhenReady(), 70);\n      return;\n    }\n    this._initMap();\n  }\n\n  _initMap() {\n    if (this.map) return;\n    const map = window.L.map(this.mapRef.current, {\n      center: [25.10, 55.22], zoom: 11, minZoom: 9, maxZoom: 16,\n      zoomControl: true, scrollWheelZoom: true, attributionControl: false, preferCanvas: true,\n    });\n    window.L.control.attribution({ position: 'bottomright', prefix: false })\n      .addAttribution('© OpenStreetMap · CartoDB').addTo(map);\n    window.L.tileLayer(this._tileUrl(), { maxZoom: 19, subdomains: 'abcd' }).addTo(map);\n    this.map = map;\n    this._renderMarkers();\n    if (this.state.view === 'carte') setTimeout(() => map.invalidateSize(), 60);\n  }\n\n  _renderMarkers() {\n    const map = this.map;\n    if (!map || !window.QUARTIERS) return;\n    const byDist = window.DEVS_BY_DISTRICT || {};\n    window.QUARTIERS.forEach(q => {\n      if (typeof q.lat !== 'number' || typeof q.lng !== 'number') return;\n      const e = byDist[q.id];\n      const has = !!(e && ((e.tier1||[]).length + (e.tier2||[]).length + (e.tier3||[]).length) > 0);\n      const sel = this.state.district === q.id;\n      const color = sel ? '#C19A3E' : (has ? '#16243B' : '#A7AAB0');\n      const cls = 'dub-mk ' + (sel ? 'sel' : '');\n      const html = '<div class=\"' + cls + '\" style=\"--mc:' + color + '\"><div class=\"dub-dot\"><\u002Fdiv><div class=\"dub-lbl\">' + q.nom + '<\u002Fdiv><\u002Fdiv>';\n      const icon = window.L.divIcon({ className: 'dub-wrap', html, iconSize: [180, 40], iconAnchor: [90, 8] });\n      let m = this.markers[q.id];\n      if (!m) {\n        m = window.L.marker([q.lat, q.lng], { icon, riseOnHover: true }).addTo(map);\n        m.on('click', () => this._selectDistrict(q.id));\n        this.markers[q.id] = m;\n      } else {\n        m.setIcon(icon);\n      }\n    });\n  }\n\n  _openDev(key) { this.setState({ dev: key }); }\n  _selectDistrict(id) { this.setState({ district: id }, () => this._renderMarkers()); }\n\n  _devChips(qk) {\n    const data = window.PROMOTEURS || [];\n    const Q = window.QUALITY || {};\n    const L = window.LIVRAISON || {};\n    const q = (this.state.query || '').trim().toLowerCase();\n    return data\n      .filter(p => p.quality === qk)\n      .filter(p => !q || p.nom.toLowerCase().includes(q))\n      .map(p => ({\n        key: p.key, nom: p.nom,\n        glyph: (Q[p.quality] || {}).glyph || '',\n        livColor: (L[p.livraison] || {}).color || '#ccc',\n        onClick: () => this._openDev(p.key),\n      }));\n  }\n\n  _enrichDev() {\n    const key = this.state.dev;\n    if (!key || !window.PROMO_BY_KEY) return null;\n    const d = window.PROMO_BY_KEY[key];\n    if (!d) return null;\n    const Q = window.QUALITY[d.quality] || {};\n    const L = window.LIVRAISON[d.livraison] || {};\n    const showSales = !(this.props && this.props.showSales === false);\n    const stars = '★'.repeat(Q.stars || 0) + '☆'.repeat(5 - (Q.stars || 0));\n    const hasProjets = (d.projets || []).length > 0;\n    return Object.assign({}, d, {\n      qLabel: Q.label, qColor: Q.color, qBg: Q.bg, qGlyph: Q.glyph, stars,\n      tierLabel: 'Tier ' + Q.tier,\n      livLabel: L.label, livSub: L.sub, livColor: L.color, livBg: L.bg,\n      volStr: d.volumeAED != null ? d.volumeAED.toFixed(2) + ' Mds AED' : '—',\n      txStr: d.transactions != null ? d.transactions.toLocaleString('fr-FR') : '—',\n      tailleStr: d.taille || '—',\n      hasForces: (d.forces || []).length > 0,\n      hasZones: (d.zones || []).length > 0,\n      hasProjets, noProjets: !hasProjets,\n      _showSales: showSales,\n    });\n  }\n\n  _enrichDistrict() {\n    const did = this.state.district;\n    if (!did || !window.QUARTIERS) return null;\n    const Q = window.QUALITY || {};\n    const L = window.LIVRAISON || {};\n    const qz = window.QUARTIERS.find(x => x.id === did) || {};\n    const entry = (window.DEVS_BY_DISTRICT || {})[did];\n    const grp = (arr) => {\n      const ds = (arr || [])\n        .map(k => window.PROMO_BY_KEY[k])\n        .filter(Boolean)\n        .map(p => ({\n          key: p.key, nom: p.nom,\n          qLabel: (Q[p.quality] || {}).label,\n          qColor: (Q[p.quality] || {}).color,\n          livLabel: (L[p.livraison] || {}).label,\n          livColor: (L[p.livraison] || {}).color,\n          onClick: () => this._openDev(p.key),\n        }));\n      return { devs: ds, empty: ds.length === 0 };\n    };\n    const t1 = grp(entry && entry.tier1), t2 = grp(entry && entry.tier2), t3 = grp(entry && entry.tier3);\n    const count = t1.devs.length + t2.devs.length + t3.devs.length;\n    return {\n      nom: qz.nom || '', zone: qz.zone || '',\n      count, empty: count === 0,\n      inferred: false,\n      tier1: t1, tier2: t2, tier3: t3,\n    };\n  }\n\n  renderVals() {\n    const view = this.state.view;\n    const isTab = view === 'tableau';\n    const dev = this._enrichDev();\n    const district = this._enrichDistrict();\n    const total = (window.PROMOTEURS || []).length;\n    return {\n      totalCount: total,\n      view, isTableau: isTab, isCarte: !isTab,\n      tableauDisplay: isTab ? 'block' : 'none',\n      carteDisplay: isTab ? 'none' : 'block',\n      tabTableauBg: isTab ? '#C19A3E' : 'transparent',\n      tabTableauFg: isTab ? '#16243B' : 'rgba(255,255,255,.7)',\n      tabCarteBg: !isTab ? '#C19A3E' : 'transparent',\n      tabCarteFg: !isTab ? '#16243B' : 'rgba(255,255,255,.7)',\n      showTableau: () => this.setState({ view: 'tableau' }),\n      showCarte: () => this.setState({ view: 'carte' }, () => {\n        if (this.map) { setTimeout(() => this.map.invalidateSize(), 60); }\n        else { this._initWhenReady(); }\n      }),\n      query: this.state.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      luxeDevs: this._devChips('luxe'),\n      premiumDevs: this._devChips('premium'),\n      middleDevs: this._devChips('middle'),\n      massDevs: this._devChips('mass'),\n      mapRef: this.mapRef,\n      waHref: (typeof window !== 'undefined' && window.waLink) ? window.waLink() : '#',\n      devOpen: !!dev, dev: dev || {},\n      salesBlock: !!(dev && dev._showSales && dev.volumeAED != null),\n      closeDev: () => this.setState({ dev: null }),\n      districtOpen: !!district, district: district || {},\n      closeDistrict: () => this.setState({ district: null }, () => this._renderMarkers()),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
